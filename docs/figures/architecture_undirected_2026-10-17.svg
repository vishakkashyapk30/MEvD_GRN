<rect x="1230" y="190" width="300" height="420" rx="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/>
<circle cx="1305" cy="290" r="30" fill="#1F2937"/><text x="1305" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">u</text>
<circle cx="1455" cy="290" r="30" fill="#1F2937"/><text x="1455" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">v</text>
<line x1="1366" y1="290" x2="1394" y2="290" stroke="#1F2937" stroke-width="3" marker-start="url(#arrs)" marker-end="url(#arrs)"/>
<text x="1380" y="356" text-anchor="middle" font-size="17" fill="#8A94A0">same score either way</text>
<text x="1380" y="470" text-anchor="middle" font-size="64" font-weight="700" fill="#009E73">0.93</text>
<text x="1380" y="506" text-anchor="middle" font-size="17" fill="#1F2937">chance of a link</text>
<text x="1380" y="532" text-anchor="middle" font-size="14" fill="#8A94A0">(example score)</text>
