<text x="190.0" y="523.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">Matched features</text>
<text x="190.0" y="549.0" text-anchor="middle" font-size="15" fill="#8A94A0">scMultiomeGRN's own, optional</text>
