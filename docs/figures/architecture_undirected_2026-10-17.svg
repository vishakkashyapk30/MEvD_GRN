<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-size="38" font-weight="700" fill="#1F2937">MeVD-GRN</text>
<text x="60" y="100" font-size="19" fill="#8A94A0">Do two transcription factors (TFs) form a regulatory link?</text>
<text x="190" y="160" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8A94A0">WHAT IT READS</text>
<text x="560" y="160" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8A94A0">TF GRAPHS</text>
<text x="930" y="160" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8A94A0">TWO GRAPH NETWORKS</text>
<text x="1425" y="160" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8A94A0">SCORE A PAIR</text>
<rect x="60" y="190" width="260" height="110" rx="18" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/>
<text x="190.0" y="243.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">scRNA + scATAC</text>
<text x="190.0" y="269.0" text-anchor="middle" font-size="15" fill="#8A94A0">one summary per TF</text>
<rect x="60" y="330" width="260" height="110" rx="18" fill="#FFFFFF" stroke="#CC79A7" stroke-width="3"/>
<text x="190.0" y="383.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">Geneformer</text>
<text x="190.0" y="409.0" text-anchor="middle" font-size="15" fill="#8A94A0">pretrained gene identity</text>
