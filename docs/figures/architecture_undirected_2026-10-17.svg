<text x="90" y="772" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8A94A0">HOW IT IS TRAINED AND TESTED</text>
<rect x="90" y="788" width="410" height="58" rx="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/>
<circle cx="122" cy="817" r="18" fill="#0072B2"/><text x="122" y="824" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
<text x="152" y="811" font-size="17" font-weight="700" fill="#1F2937">Learn from known links</text>
<text x="152" y="832" font-size="14" fill="#8A94A0">a part of the TF-TF links, never the test ones</text>
<rect x="540" y="788" width="410" height="58" rx="14" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/>
<circle cx="572" cy="817" r="18" fill="#E69F00"/><text x="572" y="824" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
<text x="602" y="811" font-size="17" font-weight="700" fill="#1F2937">Hold out a test fold</text>
<text x="602" y="832" font-size="14" fill="#8A94A0">same official folds as scMultiomeGRN</text>
<rect x="990" y="788" width="410" height="58" rx="14" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
<circle cx="1022" cy="817" r="18" fill="#009E73"/><text x="1022" y="824" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3</text>
<text x="1052" y="811" font-size="17" font-weight="700" fill="#1F2937">Score with their metric</text>
<text x="1052" y="832" font-size="14" fill="#8A94A0">AUROC and AUPR on links never trained on</text>
