<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Poppins, Inter, Arial, sans-serif">
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/></filter></defs>
<rect width="1600" height="860" fill="#FFFFFF"/>
<text x="60" y="64" font-size="36" font-weight="700" fill="#1F2937">scMultiomeGRN vs MeVD-GRN</text>
<text x="60" y="98" font-size="18" fill="#6B7280">Same ingredients (paired RNA + ATAC, graph encoders, link-prediction loss), different design choices</text>
<text x="327.5" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">TASK</text>
<text x="544.5" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">INPUT GRAPH</text>
<text x="761.5" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">ENCODER</text>
<text x="978.5" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">MODALITY FUSION</text>
<text x="1195.5" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">DECODER</text>
<text x="1412.5" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">TRAINING LABELS</text>
<rect x="60" y="175" width="150" height="150" rx="16" fill="#009E73"/>
<text x="135" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">scMultiomeGRN</text>
<rect x="225" y="175" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="327.5" y="245.0" text-anchor="middle" font-size="17" fill="#1F2937">Undirected TF-TF</text>
<text x="327.5" y="268.0" text-anchor="middle" font-size="17" fill="#1F2937">link completion</text>
<rect x="442" y="175" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="544.5" y="245.0" text-anchor="middle" font-size="17" fill="#1F2937">The known (training)</text>
<text x="544.5" y="268.0" text-anchor="middle" font-size="17" fill="#1F2937">edges</text>
<rect x="659" y="175" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="761.5" y="245.0" text-anchor="middle" font-size="17" fill="#1F2937">GraFRank attention +</text>
<text x="761.5" y="268.0" text-anchor="middle" font-size="17" fill="#1F2937">edge histograms</text>
<rect x="876" y="175" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="978.5" y="245.0" text-anchor="middle" font-size="17" fill="#1F2937">Cross-modal</text>
<text x="978.5" y="268.0" text-anchor="middle" font-size="17" fill="#1F2937">attention, per node</text>
<rect x="1093" y="175" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="1195.5" y="245.0" text-anchor="middle" font-size="17" fill="#1F2937">Concat-MLP (paper</text>
<text x="1195.5" y="268.0" text-anchor="middle" font-size="17" fill="#1F2937">says inner product)</text>
<rect x="1310" y="175" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="1412.5" y="245.0" text-anchor="middle" font-size="17" fill="#1F2937">Motif hits from the</text>
<text x="1412.5" y="268.0" text-anchor="middle" font-size="17" fill="#1F2937">same ATAC (circular)</text>
<rect x="60" y="365" width="150" height="150" rx="16" fill="#0072B2"/>
<text x="135" y="445" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">MeVD-GRN</text>
<rect x="225" y="365" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="327.5" y="435.0" text-anchor="middle" font-size="17" fill="#1F2937">Directed TF → any</text>
<text x="327.5" y="458.0" text-anchor="middle" font-size="17" fill="#1F2937">gene</text>
<rect x="442" y="365" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="544.5" y="424.0" text-anchor="middle" font-size="17" fill="#1F2937">Label-free: co-</text>
<text x="544.5" y="447.0" text-anchor="middle" font-size="17" fill="#1F2937">expression + TF-</text>
<text x="544.5" y="470.0" text-anchor="middle" font-size="17" fill="#1F2937">candidates</text>
<rect x="659" y="365" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="761.5" y="435.0" text-anchor="middle" font-size="17" fill="#1F2937">GraphSAGE towers +</text>
<text x="761.5" y="458.0" text-anchor="middle" font-size="17" fill="#1F2937">Geneformer prior</text>
<rect x="876" y="365" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="978.5" y="435.0" text-anchor="middle" font-size="17" fill="#1F2937">None until the</text>
<text x="978.5" y="458.0" text-anchor="middle" font-size="17" fill="#1F2937">decoder</text>
<rect x="1093" y="365" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="1195.5" y="424.0" text-anchor="middle" font-size="17" fill="#1F2937">Bilinear TF→gene</text>
<text x="1195.5" y="447.0" text-anchor="middle" font-size="17" fill="#1F2937">score gated by ATAC</text>
<text x="1195.5" y="470.0" text-anchor="middle" font-size="17" fill="#1F2937">openness</text>
<rect x="1310" y="365" width="205" height="150" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="1412.5" y="424.0" text-anchor="middle" font-size="17" fill="#1F2937">ChIP, then knockout;</text>
<text x="1412.5" y="447.0" text-anchor="middle" font-size="17" fill="#1F2937">their overlap held</text>
<text x="1412.5" y="470.0" text-anchor="middle" font-size="17" fill="#1F2937">out</text>
<text x="60" y="590" font-size="15" font-weight="600" letter-spacing="1.4" fill="#6B7280">TRAINING</text>
<rect x="60" y="610" width="150" height="70" rx="16" fill="#009E73"/><text x="135" y="652" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">scMultiomeGRN</text>
<rect x="225" y="610" width="1290" height="70" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="3" filter="url(#sh)"/>
<text x="247" y="652" font-size="18" fill="#1F2937">10 runs, up to 2,000 epochs each; keep edges that win a 6-of-10 vote; one flat label set</text>
<rect x="60" y="700" width="150" height="70" rx="16" fill="#0072B2"/><text x="135" y="742" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">MeVD-GRN</text>
<rect x="225" y="700" width="1290" height="70" rx="16" fill="#FFFFFF" stroke="#0072B2" stroke-width="3" filter="url(#sh)"/>
<text x="247" y="742" font-size="18" fill="#1F2937">45 epochs, no voting; evidence curriculum (ChIP → knockout); zero-shot test on the ChIP ∩ knockout tier</text>
<text x="60" y="815" font-size="15" fill="#6B7280">Shared: GraFRank-style separate RNA and ATAC pathways; class-weighted BCE loss; MAESTRO-style regulatory-potential ATAC features.</text>
</svg>