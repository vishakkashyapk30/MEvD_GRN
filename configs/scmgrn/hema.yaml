# scMultiomeGRN SECONDARY benchmark: human adult hematopoiesis (Buenrostro et al. 2018, hg19; Supp. Fig. S1).
# Inputs are built by scripts/scmgrn/14b_scmgrn_hema_prepare.py (scRNA: mmc4 Data S2; scATAC: single-cell BAMs).
# All paths are relative to the benchmark root (--root / $SCMGRN_ROOT; on Ada
# /share1/$USER/mevd_grn/scmgrn, staged to /scratch inside jobs).
# Protocol + targets: docs/benchmarks/scmultiomegrn.md
dataset: hema
genome: hg19
genome_fasta: raw/genome/hg19.fa
official_repo: official/ScmultiomeGRN-main
promoter_file: official/ScmultiomeGRN-main/data_resource/gencode.v19.ProteinCoding_gene_promoter.txt
motif_zip: official/ScmultiomeGRN-main/data_resource/HOCOMOCOv11.zip
maestro_refgenes: raw/maestro/GRCh38_refgenes.txt   # official pipeline hard-codes GRCh38
maestro_decay: 1000                                  # extract_atac_feature(genedistance=1000)
peak_threshold: 0.1                                  # peaks detected in >10% of cells
fimo_thresh: 1.0e-4
tfbs_thresh: 1.0e-6
split: {seed: 666, n_splits: 10, train_split_rate: 0.8, rest_all_train: true}
sep_data: sep_data/hema          # <cell_type>/{atac,scrna}/{matrix.mtx,barcodes.tsv,peaks.tsv|genes.tsv}
graph_dir: graph/hema
splits_dir: splits/hema
processed_dir: processed/hema
results_dir: results/hema


# Targets: scMultiomeGRN ATAC+scRNA (Supp. Fig. S1; AUROC / AUPR), "all" (full-matrix) evaluation set.
# scATAC cells: HSC 347, CMP 502, GMP 402 (metadata.tsv); scRNA cells: hsc 2268, cmp0-2 4454, gmp 1096 (mmc4).
cell_types:
  HSC: {auroc: 0.92, aupr: 0.67, src: "Supp Fig S1"}
  CMP: {auroc: 0.92, aupr: 0.66, src: "Supp Fig S1"}
  GMP: {auroc: 0.93, aupr: 0.71, src: "Supp Fig S1"}
paper_baselines:   # Supp Fig S1, AUROC / AUPR
  DeepTFni: {HSC: [0.89, 0.60], CMP: [0.90, 0.65], GMP: [0.91, 0.70]}
  GENELink: {HSC: [0.90, 0.58], CMP: [0.87, 0.50], GMP: [0.91, 0.64]}
